<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10181b"><title>Petri Evolution</title><link rel="stylesheet" href="style.css"></head><body><main id="game"><canvas id="c"></canvas><section id="hud"><div class="top"><b>PETRI EVOLUTION</b><span id="level">LV 1</span></div><div class="bar hp"><i id="hp"></i><b id="hpText">HP 100/100</b></div><div class="bar xp"><i id="xp"></i><b id="xpText">BIOMASS 0/8</b></div></section><div id="controlZone"><div id="joystick"><div id="stick"></div></div><span>MOVE</span></div><div id="hint">LEFT THUMB TO SWIM</div><section id="mutations" class="overlay hidden"><h2>Mutation Available</h2><p>Choose one adaptation.</p><div id="cards"></div></section><section id="dead" class="overlay hidden"><h1>Culture Collapsed</h1><p id="score"></p><button id="restart">Grow Again</button></section></main><div id="bootdiag" style="display:none;position:fixed;z-index:99999;left:8px;right:8px;bottom:8px;max-height:38vh;overflow:auto;padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.86);color:#fff;font:11px/1.35 monospace;white-space:pre-wrap;pointer-events:none"></div>
<script>
(()=>{const box=document.getElementById("bootdiag");window.__petriBoot={start:performance.now(),frames:0,show(m){box.style.display="block";box.textContent+="\n"+m}};
addEventListener("error",e=>window.__petriBoot.show("ERROR: "+(e.message||"unknown")+" @ "+(e.filename||"")+" :"+(e.lineno||0)));
addEventListener("unhandledrejection",e=>window.__petriBoot.show("PROMISE: "+String(e.reason)));
setTimeout(()=>{if(window.__petriBoot.frames<2)window.__petriBoot.show("STARTUP STALL: game frames="+window.__petriBoot.frames+" ready="+document.readyState)},1800);
})();
</script>\n<script src="game.js?v=20260926-4"></script></body></html>
