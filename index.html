<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10181b"><title>Petri Evolution</title><link rel="stylesheet" href="style.css?v=20260926-13"></head><body><main id="game"><canvas id="c"></canvas><button id="pauseBtn" aria-label="Pause" style="position:fixed;z-index:9;left:5px;top:154px;width:34px;height:42px;border:0;background:transparent;padding:4px;display:none;filter:drop-shadow(0 2px 4px rgba(0,45,130,.5))"><span style="display:inline-block;width:8px;height:30px;border-radius:4px;background:linear-gradient(90deg,#1774db,#71c5ff 42%,#2788ed 72%,#0b54ba);box-shadow:inset 1px 1px 2px rgba(255,255,255,.65)"></span><span style="display:inline-block;width:8px;height:30px;margin-left:4px;border-radius:4px;background:linear-gradient(90deg,#1774db,#71c5ff 42%,#2788ed 72%,#0b54ba);box-shadow:inset 1px 1px 2px rgba(255,255,255,.65)"></span></button><section id="hud"><div class="top"><b>PETRI EVOLUTION</b><span id="level">LV 1</span></div><div class="bar hp"><i id="hp"></i><b id="hpText">HP 100/100</b></div><div class="bar xp"><i id="xp"></i><b id="xpText">BIOMASS 0/8</b></div><div id="buildRow" style="display:flex;align-items:center;gap:4px;margin-top:6px;min-height:34px;max-width:calc(100vw - 28px);overflow-x:auto;overflow-y:hidden;padding:2px 1px 4px;scrollbar-width:none"></div></section><div id="controlZone"><div id="joystick"><div id="stick"></div></div><span>MOVE</span></div><div id="hint">LEFT THUMB TO SWIM</div><section id="mutations" class="overlay hidden"><h2>Mutation Available</h2><p>Choose one adaptation.</p><div id="cards"></div></section>
<section id="startMenu" class="overlay" style="z-index:30"><h1>PETRI EVOLUTION</h1><p>Evolve. Adapt. Survive.</p><button id="playBtn">PLAY</button><button id="settingsBtn">SETTINGS</button></section>
<section id="settingsMenu" class="overlay hidden" style="z-index:31"><h2>SETTINGS</h2><button id="musicToggle">MUSIC: ON</button><button id="audioToggle">ALL AUDIO: ON</button><button id="controlModeBtn">CONTROLS: LEFT JOYSTICK</button><button id="settingsBack">BACK</button></section>
<section id="mutationLibrary" class="overlay hidden" style="z-index:32"><h2>CURRENT MUTATIONS</h2><p>Tap an adaptation to review its effects.</p><div id="mutationLibraryList" style="width:min(420px,92vw);max-height:56vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px"></div><button id="mutationLibraryBack">BACK</button></section><section id="mutationDetail" class="overlay hidden" style="z-index:33"><div id="mutationDetailIcon" style="font-size:54px"></div><h2 id="mutationDetailName"></h2><p id="mutationDetailText" style="max-width:390px;line-height:1.5"></p><button id="mutationDetailBack">BACK</button></section><section id="pauseMenu" class="overlay hidden" style="z-index:31"><h2>PAUSED</h2><button id="resumeBtn">RESUME</button><button id="currentMutationsBtn">CURRENT MUTATIONS</button><button id="pauseSettingsBtn">SETTINGS</button><button id="pauseRestartBtn">RESTART RUN</button></section>
<section id="dead" class="overlay hidden"><h1>Culture Collapsed</h1><p id="score"></p><button id="restart">Grow Again</button></section></main><div id="bootdiag" style="display:none;position:fixed;z-index:99999;left:8px;right:8px;bottom:8px;max-height:38vh;overflow:auto;padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.86);color:#fff;font:11px/1.35 monospace;white-space:pre-wrap;pointer-events:none"></div>
<script>
(()=>{const box=document.getElementById("bootdiag");window.__petriBoot={start:performance.now(),frames:0,show(m){box.style.display="block";box.textContent+="\n"+m}};
addEventListener("error",e=>window.__petriBoot.show("ERROR: "+(e.message||"unknown")+" @ "+(e.filename||"")+" :"+(e.lineno||0)));
addEventListener("unhandledrejection",e=>window.__petriBoot.show("PROMISE: "+String(e.reason)));
setTimeout(()=>{if(window.__petriBoot.frames<2)window.__petriBoot.show("STARTUP STALL: game frames="+window.__petriBoot.frames+" ready="+document.readyState)},1800);
})();
</script>\n<script src="game.js?v=20260926-47"></script></body></html>
